<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>INSTAT Explorer</title>
<link rel="stylesheet" href="/chart.css?v={{v}}">
<link rel="stylesheet" href="/app.css?v={{v}}">
</head>
<body>
<a class="skip" href="#main">{{Skip to the results}}</a>
<header class="top">
  <h1>INSTAT Explorer</h1>
  <span class="tag">{{Clean, understand and export INSTAT's Excel tables}}</span>
  <span class="grow"></span>
  <button id="lang" type="button" class="ghost" lang="{{other}}">{{other_name}}</button>
  <button id="theme" type="button" class="ghost" title="{{Switch between automatic, light and dark}}">{{Theme}}</button>
  <button id="about-btn" type="button" class="ghost">{{About}}</button>
</header>
<div class="layout">
  <aside id="side" aria-label="{{Get data}}"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="status" role="status" aria-live="polite"></div>
<dialog id="about" aria-label="{{About INSTAT Explorer}}"></dialog>
<noscript><p class="card">{{INSTAT Explorer needs JavaScript, which is switched off in this browser.}}</p></noscript>
<script src="/chart.js?v={{v}}" defer></script>
<script src="/app.js?v={{v}}" defer></script>
</body>
</html>
