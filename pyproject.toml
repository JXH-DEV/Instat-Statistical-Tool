[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instat-explorer"
dynamic = ["version"]
description = "Reads, cleans and explains the Excel tables published by INSTAT, the Institute of Statistics of Albania. In English and Albanian."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["INSTAT", "Albania", "statistics", "Excel", "data cleaning", "education", "open data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Albanian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# three libraries, and the standard library for everything else
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.0,<3",
    "xlrd>=2.0.1,<3",
]

[project.scripts]
instat = "instatkit.cli:main"
instat-explorer = "instatkit.cli:app_main"

[tool.setuptools.dynamic]
version = { attr = "instatkit.__version__" }

[tool.setuptools.packages.find]
include = ["instatkit*"]

[tool.setuptools.package-data]
instatkit = ["data/*.csv", "data/*.json", "viz/chart.js", "export/report.css", "web/static/*"]
